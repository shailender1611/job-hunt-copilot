[project]
name = "job-hunt-copilot"
version = "0.1.0"
description = "Multi-agent AI copilot that tailors your resume, scores job fit, and drafts cover letters."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shailender Kumar" }]
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

# ---------- tooling ----------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
